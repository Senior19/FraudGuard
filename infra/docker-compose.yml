services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command: ["redpanda","start","--mode=dev-container","--smp=1","--memory=1G","--reserve-memory=0M","--node-id=0","--check=false","--kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092","--advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092"]
    ports: ["19092:19092", "9644:9644"]
    healthcheck: {test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"], interval: 10s, timeout: 5s, retries: 15}
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: {context: .., dockerfile: Dockerfile}
    environment:
      REDIS_URL: redis://redis:6379/0
      MODEL_REGISTRY: /app/artifacts/champion.json
      CASE_DB: /app/data/cases.sqlite3
      CORS_ORIGINS: http://localhost:5173
      FEATURE_STORE_FAILURE_POLICY: ${FEATURE_STORE_FAILURE_POLICY:-fail_closed}
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-0.50}
      FRAUD_DECLINE_THRESHOLD: ${FRAUD_DECLINE_THRESHOLD:-0.90}
      MAX_SINGLE_AMOUNT: ${MAX_SINGLE_AMOUNT:-25000}
      MAX_CARD_TXNS_PER_MINUTE: ${MAX_CARD_TXNS_PER_MINUTE:-8}
      IMPOSSIBLE_TRAVEL_KMH: ${IMPOSSIBLE_TRAVEL_KMH:-900}
      APPROVED_AUDIT_SAMPLE_RATE: ${APPROVED_AUDIT_SAMPLE_RATE:-0.002}
      SHADOW_MODEL_PATH: ${SHADOW_MODEL_PATH:-}
    ports: ["8000:8000"]
    volumes: ["../data:/app/data", "../artifacts:/app/artifacts"]
    depends_on: {redis: {condition: service_healthy}}
  consumer:
    build: {context: .., dockerfile: Dockerfile}
    command: ["fraudguard-consume", "--bootstrap-servers", "redpanda:9092", "--inbox", "/app/data/transaction-inbox.sqlite3"]
    volumes: ["../data:/app/data"]
    depends_on: {redpanda: {condition: service_healthy}}
    restart: unless-stopped
  feature-worker:
    build: {context: .., dockerfile: Dockerfile}
    command: ["fraudguard-feature-worker", "--inbox", "/app/data/transaction-inbox.sqlite3", "--redis-url", "redis://redis:6379/0"]
    volumes: ["../data:/app/data"]
    depends_on: {redis: {condition: service_healthy}, consumer: {condition: service_started}}
    restart: unless-stopped
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes: ["../frontend:/app"]
    ports: ["5173:5173"]
    depends_on: [api]
  retrainer:
    build: {context: .., dockerfile: Dockerfile}
    command: ["fraudguard-retrain", "--input", "/app/data/features.parquet", "--poll-seconds", "60", "--output-dir", "/app/artifacts"]
    volumes: ["../data:/app/data", "../artifacts:/app/artifacts"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "../monitoring/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/fraudguard.json:ro
    depends_on: [prometheus]
volumes:
  redis-data:
