[project]
name = "fraudguard"
version = "0.1.0"
description = "Real-time fraud and anomaly detection platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "prometheus-client>=0.21,<1",
]

[project.scripts]
fraudguard-simulate = "fraudguard.ingestion.simulator:main"
fraudguard-consume = "fraudguard.ingestion.consumer:main"
fraudguard-features = "fraudguard.features.replay:main"
fraudguard-train = "fraudguard.ml.train:main"
fraudguard-drift = "fraudguard.monitoring.drift:main"
fraudguard-feature-worker = "fraudguard.features.worker:main"
fraudguard-export-labels = "fraudguard.cases.export:main"
fraudguard-retrain = "fraudguard.ml.scheduler:main"
fraudguard-adapt-dataset = "fraudguard.ingestion.adapters:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "fakeredis[lua]>=2.24,<3"]
stream = ["confluent-kafka>=2.5,<3", "redis>=5,<6"]
ml = ["pandas>=2.2,<3", "pyarrow>=17,<20", "duckdb>=1.1,<2", "lightgbm>=4.5,<5", "shap>=0.46,<1", "onnxruntime>=1.19,<2", "joblib>=1.4,<2", "scikit-learn>=1.5,<2", "onnx>=1.16,<2", "onnxmltools>=1.12,<2", "skl2onnx>=1.17,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

